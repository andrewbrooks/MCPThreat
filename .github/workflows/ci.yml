name: CI

on:
  push:
    branches: [master]
  pull_request:

# Least privilege: these jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs (the comment names the release) so a moved
# tag cannot change what runs with this repository's permissions.
jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Shell scripts are linted with shellcheck, which is preinstalled on GitHub's runners.
      - run: git ls-files '.githooks/*' '*.sh' | xargs shellcheck
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
        env:
          # Values only so the build can load configuration; nothing connects or signs here.
          DATABASE_URL: file:./ci.db
          NEXTAUTH_SECRET: ci-build-only-secret-0123456789abcdef0123456789
          NEXTAUTH_URL: http://localhost:3000

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reports known vulnerabilities in production dependencies. It does not fail the
    # build yet: the existing findings are being triaged. Remove continue-on-error
    # once they are resolved so new ones block merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # scan history, not just the latest commit
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
